openapi: 3.1.0
info:
  title: MSTL API
  version: 0.1.0
  description: >-
    Contrato inicial dos endpoints próprios da aplicação. Os endpoints de
    autenticação são fornecidos pelo Better Auth e documentados separadamente.
servers:
  - url: http://localhost:3000
    description: Desenvolvimento local
paths:
  /api/health:
    get:
      summary: Verifica disponibilidade da aplicação e do banco
      operationId: getHealth
      responses:
        "200":
          description: Aplicação e banco estão disponíveis
          headers:
            x-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Banco indisponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  schemas:
    HealthResponse:
      type: object
      required: [status, checks, requestId]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          required: [database]
          properties:
            database:
              type: string
              enum: [ok, error]
        requestId:
          type: string
